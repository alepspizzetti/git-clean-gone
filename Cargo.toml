[package]
name = "git-clean-gone"
version = "0.1.1"
edition = "2024"
repository = "https://github.com/eldertorres/git-clean-gone"

[dependencies]
colored = "3.0.0"
regex = "1.12.2"

[workspace.metadata.dist]
cargo-dist-version = "0.30.2"
ci = "github"
installers = ["shell", "powershell", "homebrew"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
pr-run-mode = "plan"
